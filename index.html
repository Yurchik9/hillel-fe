<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/font.css">
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <header>
        <div class="container header-container">
            <div class="logo">
                <img src="./images/logo.png" alt="GreenShop Logo">
                <span>GreenShop</span>
            </div>
            <nav class="nav">
                <a href="#" class="active">Home</a>
                <a href="#">Shop</a>
                <a href="#">Plant Care</a>
                <a href="#">Blogs</a>
            </nav>
            <button class="btnL login">Login</button>
        </div>
    </header>
    <main>
        <section class="section1">
            <div class="container">
                <div class="left-side">
                    <h3>Welcome to Greenshop</h3>
                    <h1>Let’s Make a Better <span>Planet</span></h1>
                    <p>
                        We are an online plant shop offering a wide range
                        of cheap and trendy plants.
                        Use our plants to create an unique Urban Jungle.
                        Order your favorite plants!
                    </p>
                    <button class="btn main">SHOP NOW</button>
                </div>
                <div class="right-side">
                    <img class="bigImg" src="./images/plant.png" alt="plant">
                    <img class="smallImg" src="./images/sPlant.png" alt="plant">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
